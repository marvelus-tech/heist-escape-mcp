name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build demo client
        working-directory: apps/demo-client
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://heist-escape-mcp.YOUR_ACCOUNT.workers.dev' }}
          VITE_MCP_URL: ${{ secrets.VITE_MCP_URL || 'https://heist-escape-mcp.YOUR_ACCOUNT.workers.dev/mcp' }}
          VITE_BASE_PATH: /heist-escape-mcp/
        run: |
          npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/demo-client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
