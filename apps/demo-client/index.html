<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heist Escape - Cooperative Museum Heist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(120% 90% at 50% 0%, #fdfcf9 0%, #f4efe4 60%, #ebe4d6 100%);
      color: #1f1b15;
      min-height: 100vh;
    }
    
    #app {
      width: 100vw;
      min-height: 100vh;
    }
    
    /* Loading screen */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 253, 248, 0.92);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(201, 162, 74, 0.6);
      box-shadow: 0 12px 32px rgba(70, 52, 20, 0.12);
      text-align: center;
      color: #1f1b15;
      font-size: 20px;
      font-weight: 600;
      z-index: 9999;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      margin: 20px auto;
      border: 4px solid #efeae0;
      border-top-color: #c9a24a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Hide loading once app loads */
    .loaded #loading {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      Loading Heist Escape...
    </div>
  </div>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
